; PlatformIO Project Configuration File
; Geode AGM - Walter ESP32-S3 ADC Sampler with Azure IoT Hub Telemetry
;
; Hardware: DPTechnics Walter (ESP32-S3 + Sequans GM02SP LTE Modem)
; ADC: ADS1256 24-bit ADC at 1000 SPS
; Connectivity: Local WiFi AP for WebUI + LTE for Azure IoT Hub telemetry

[env:walter]
; Use platform version 5.x for WalterModem compatibility (ESP-IDF 4.4.x)
platform = espressif32@5.4.0
; Use custom Walter board definition (see boards/walter.json)
board = walter
framework = arduino

; Tell PlatformIO where to find custom board
boards_dir = boards

; Partition scheme for Walter (16MB flash, space for modem firmware updates)
board_build.partitions = default_16MB.csv

; Remove default C++ standard so we can use C++17
build_unflags = -std=gnu++11

build_flags =
    ; Enable C++17 for WalterModem (uses static inline variables)
    -std=gnu++17
    ; Compatibility shim for WalterModem (must be first to override system headers)
    ; Use absolute path so it applies to library compilation too
    -I${PROJECT_DIR}/include/compat
    ; ESP-IDF 4.4.x -> 5.x API compatibility (function renamed, same signature)
    -Desp_vfs_fat_spiflash_mount_rw_wl=esp_vfs_fat_spiflash_mount
    ; PSRAM support (Walter has 2MB PSRAM via QSPI)
    -DCONFIG_SPIRAM_SUPPORT=1
    -DCONFIG_SPIRAM_USE_MALLOC=1
    ; FreeRTOS config
    -DCONFIG_FREERTOS_HZ=1000
    ; Walter modem config
    -DWALTER_MODEM_DEBUG=1
    ; Project config
    -DSAMPLE_RATE_HZ=1000
    -DFRAME_SIZE=1000
    ; Azure IoT Hub config (embedded for simplicity)
    -DAZURE_IOT_HUB_HOST=\"PaidSense.azure-devices.net\"
    -DAZURE_DEVICE_ID=\"Geode_Walt_0001\"
    ; WiFi AP config
    -DWIFI_AP_SSID=\"Geode_AGM\"
    ; Debug output
    -DDEBUG_ENABLED=1

; Monitor settings
monitor_speed = 921600
monitor_filters = esp32_exception_decoder

; Upload settings
upload_speed = 921600

; Library dependencies
lib_deps =
    ; Walter modem library
    https://github.com/QuickSpot/walter-arduino.git
    ; Web server (use GitHub URLs for me-no-dev originals)
    https://github.com/me-no-dev/AsyncTCP.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    ; JSON handling
    bblanchon/ArduinoJson
    ; SHA256 for SAS token (ESP32 has mbedtls built-in, no external lib needed)

; Ignore libraries for other platforms pulled in by dependencies
lib_ignore =
    AsyncTCP_RP2040W
    ESPAsyncTCP-esphome
    mbedtls

; Build type
build_type = release

; Extra scripts for embedding web files
extra_scripts =
    pre:scripts/embed_webui.py

; =============================================================================
; GNSS Debug Environment
; =============================================================================
; Build with: pio run -e gnss_debug
; Flash with: pio run -e gnss_debug -t upload
;
; This environment runs a standalone GNSS location test program that:
; - Tests multiple acquisition methods (cold/warm/hot start)
; - Compares different sensitivity modes
; - Queries cell tower information
; - Reports pass/fail results with timing
;
[env:gnss_debug]
extends = env:walter

; Only compile the GNSS debug file, exclude main.cpp
build_src_filter = +<*> -<main.cpp> -<azure_iot.cpp> -<webui.cpp> -<webui_html.cpp> -<ads1256.cpp>

build_flags =
    ${env:walter.build_flags}
    ; Enable GNSS debug mode
    -DGNSS_DEBUG_MODE=1

; Don't need web embedding for debug
extra_scripts =
