; PlatformIO Project Configuration for Walter ESP32-S3
; Walter is an ESP32-S3 based board with Sequans GM02SP LTE modem
; https://www.quickspot.io

[platformio]
boards_dir = boards

[env:walter]
platform = espressif32
board = walter
framework = arduino

; Build configuration for Walter ESP32-S3
; USB serial console enabled for debugging
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; No external library dependencies needed for serial passthrough

; Monitor settings for debugging
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Upload settings
upload_speed = 921600
