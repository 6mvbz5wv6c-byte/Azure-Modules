; PlatformIO Project Configuration for Walter Feels Hardware Tester
; https://docs.platformio.org/page/projectconf.html

[env:walter_feels]
platform = espressif32@5.4.0
; Use generic ESP32-S3 board (walter board auto-includes WalterModem which we don't need)
board = esp32-s3-devkitc-1
framework = arduino

; Build flags
build_unflags = -std=gnu++11

build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_SUPPORT=1
    -DCONFIG_SPIRAM_USE_MALLOC=1

; Serial monitor configuration
monitor_speed = 921600
monitor_filters = esp32_exception_decoder

; Upload settings
upload_speed = 921600

; Libraries
lib_deps =
    Wire

; Explicitly ignore WalterModem (pulled in by some board configs)
lib_ignore =
    WalterModem

; Extra scripts
extra_scripts = pre:scripts/pre_build.py
