; PlatformIO Project Configuration for Walter Feels Hardware Tester
; https://docs.platformio.org/page/projectconf.html

[env:walter_feels]
platform = espressif32@5.4.0
board = walter
framework = arduino

; Build flags
build_unflags = -std=gnu++11

build_flags =
    -std=gnu++17
    ; Compatibility shim for WalterModem (must be first to override system headers)
    -Iinclude/compat
    ; ESP-IDF API compatibility
    -Desp_vfs_fat_spiflash_mount_rw_wl=esp_vfs_fat_spiflash_mount
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=4
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_SUPPORT=1
    -DCONFIG_SPIRAM_USE_MALLOC=1

; Serial monitor configuration
monitor_speed = 921600
monitor_filters = esp32_exception_decoder

; Upload settings
upload_speed = 921600

; Libraries
lib_deps =
    https://github.com/QuickSpot/walter-arduino.git
    Wire

; Board directory
boards_dir = boards

; Extra scripts (for custom board)
extra_scripts = pre:scripts/pre_build.py
